<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1a14"/>
      <stop offset="100%" stop-color="#1a2a22"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#g)"/>
  <!-- top-down floorplan: two frames converging to one shared origin -->
  <g opacity="0.5">
    <rect x="1040" y="200" width="460" height="460" rx="14" fill="none" stroke="#3a4f43" stroke-width="3" stroke-dasharray="14 10"/>
  </g>
  <!-- shared origin axes (green = aligned) -->
  <g stroke="#7fbc8c" stroke-width="3" opacity="0.7">
    <line x1="1190" y1="430" x2="1350" y2="430"/>
    <line x1="1270" y1="350" x2="1270" y2="510"/>
  </g>
  <!-- ghost frame (amber, offset = pre-alignment) -->
  <g stroke="#d4a574" stroke-width="2.5" opacity="0.45" stroke-dasharray="8 6">
    <line x1="1330" y1="540" x2="1470" y2="540"/>
    <line x1="1400" y1="470" x2="1400" y2="610"/>
  </g>
  <circle cx="1270" cy="430" r="20" fill="#7fbc8c"/>
  <!-- two avatars + shared object -->
  <circle cx="1160" cy="380" r="18" fill="#7fbc8c"/>
  <circle cx="1360" cy="500" r="18" fill="#d4a574"/>
  <rect x="1248" y="288" width="44" height="44" rx="8" fill="#7fbc8c"/>
  <!-- anchors -->
  <g fill="#d4a574" opacity="0.8">
    <rect x="1070" y="226" width="18" height="18" rx="3"/>
    <rect x="1452" y="240" width="18" height="18" rx="3"/>
    <rect x="1080" y="616" width="18" height="18" rx="3"/>
    <rect x="1448" y="606" width="18" height="18" rx="3"/>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#f0e8d9">
    <text x="80" y="180" font-size="32" font-weight="700" fill="#7fbc8c" letter-spacing="4">SPATIAL ANCHORS · SPATIAL ALIGNMENT</text>
    <text x="80" y="320" font-size="92" font-weight="900">Colocated</text>
    <text x="80" y="412" font-size="92" font-weight="900">Multiplayer MR</text>
    <text x="80" y="512" font-size="56" font-weight="700" fill="#d4a574">大空间多人联机 · 一个共享 origin</text>
    <text x="80" y="640" font-size="34" fill="#c6d2cb">anchor → alignment → networked room → state sync → public relay</text>
    <text x="80" y="698" font-size="34" fill="#c6d2cb">targets Pico large-space · Netcode SDK unverified (video-only)</text>
    <g transform="translate(80, 778)">
      <rect x="0" y="0" rx="999" ry="999" width="200" height="60" fill="none" stroke="#d4a574" stroke-width="3"/>
      <text x="100" y="40" font-size="28" fill="#d4a574" text-anchor="middle" font-weight="600">Spatial Anchors</text>
      <rect x="220" y="0" rx="999" ry="999" width="200" height="60" fill="none" stroke="#7fbc8c" stroke-width="3"/>
      <text x="320" y="40" font-size="28" fill="#7fbc8c" text-anchor="middle" font-weight="600">Alignment</text>
      <rect x="440" y="0" rx="999" ry="999" width="120" height="60" fill="none" stroke="#d4a574" stroke-width="3"/>
      <text x="500" y="40" font-size="28" fill="#d4a574" text-anchor="middle" font-weight="600">Pico</text>
    </g>
  </g>
  <text x="1560" y="860" font-size="22" fill="#5e7a6b" text-anchor="end" font-family="system-ui, sans-serif">study-derived · video-only course</text>
</svg>
