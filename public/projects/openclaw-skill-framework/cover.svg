<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="170" y1="80" x2="1400" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F1A18"/>
      <stop offset="0.5" stop-color="#0E1714"/>
      <stop offset="1" stop-color="#1A1810"/>
    </linearGradient>
    <filter id="blur" x="-200" y="-200" width="2000" height="1300" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="100"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="40" fill="url(#bg)"/>
  <g opacity="0.78" filter="url(#blur)">
    <circle cx="380" cy="220" r="170" fill="#3D8B55"/>
    <circle cx="1220" cy="720" r="200" fill="#D4A574" fill-opacity="0.42"/>
  </g>

  <rect x="160" y="108" width="1280" height="684" rx="34" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)"/>

  <text x="230" y="208" fill="#F0EFE8" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800">OpenClaw Skill Builder</text>
  <text x="230" y="256" fill="#B8C4BC" font-family="Inter, Arial, sans-serif" font-size="22">Scaffolding CLI, local test harness, and CI validation for reusable agent skills.</text>

  <rect x="232" y="328" width="378" height="358" rx="28" fill="rgba(127,188,140,0.12)" stroke="rgba(127,188,140,0.22)"/>
  <text x="272" y="392" fill="#F0EFE8" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">Scaffold</text>
  <text x="272" y="436" fill="#B8C4BC" font-family="Inter, Arial, sans-serif" font-size="18">claw skill new pr-reviewer</text>
  <rect x="272" y="488" width="298" height="44" rx="12" fill="rgba(255,255,255,0.06)"/>
  <text x="292" y="517" fill="#F0EFE8" font-family="Inter, Arial, sans-serif" font-size="15" font-family="ui-monospace">  ✓ SKILL.md</text>
  <rect x="272" y="544" width="298" height="44" rx="12" fill="rgba(255,255,255,0.06)"/>
  <text x="292" y="573" fill="#F0EFE8" font-family="Inter, Arial, sans-serif" font-size="15">  ✓ scripts/</text>
  <rect x="272" y="600" width="298" height="44" rx="12" fill="rgba(255,255,255,0.06)"/>
  <text x="292" y="629" fill="#F0EFE8" font-family="Inter, Arial, sans-serif" font-size="15">  ✓ references/</text>

  <rect x="640" y="296" width="320" height="410" rx="30" fill="rgba(212,165,116,0.14)" stroke="rgba(212,165,116,0.24)"/>
  <text x="678" y="360" fill="#F0EFE8" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Skill Anatomy</text>
  <text x="678" y="404" fill="#B8C4BC" font-family="Inter, Arial, sans-serif" font-size="18">Frontmatter routes the agent, content does the work.</text>
  <rect x="678" y="460" width="248" height="222" rx="16" fill="rgba(0,0,0,0.22)"/>
  <text x="698" y="498" fill="#7FBC8C" font-family="Inter, Arial, sans-serif" font-size="15">---</text>
  <text x="698" y="524" fill="#F0EFE8" font-family="Inter, Arial, sans-serif" font-size="15">name: pr-reviewer</text>
  <text x="698" y="550" fill="#F0EFE8" font-family="Inter, Arial, sans-serif" font-size="15">description: Review</text>
  <text x="698" y="576" fill="#F0EFE8" font-family="Inter, Arial, sans-serif" font-size="15">  PRs against ...</text>
  <text x="698" y="602" fill="#F0EFE8" font-family="Inter, Arial, sans-serif" font-size="15">triggers: [pr, diff]</text>
  <text x="698" y="628" fill="#F0EFE8" font-family="Inter, Arial, sans-serif" font-size="15">version: 0.2.1</text>
  <text x="698" y="660" fill="#7FBC8C" font-family="Inter, Arial, sans-serif" font-size="15">---</text>

  <rect x="990" y="328" width="378" height="358" rx="28" fill="rgba(255,255,255,0.05)"/>
  <text x="1030" y="392" fill="#F0EFE8" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">CI Validation</text>
  <text x="1030" y="436" fill="#B8C4BC" font-family="Inter, Arial, sans-serif" font-size="18">Same checks locally and in PR.</text>
  <rect x="1030" y="488" width="298" height="44" rx="12" fill="rgba(127,188,140,0.14)"/>
  <text x="1050" y="517" fill="#F0EFE8" font-family="Inter, Arial, sans-serif" font-size="15">✓ frontmatter schema</text>
  <rect x="1030" y="544" width="298" height="44" rx="12" fill="rgba(127,188,140,0.14)"/>
  <text x="1050" y="573" fill="#F0EFE8" font-family="Inter, Arial, sans-serif" font-size="15">✓ link integrity</text>
  <rect x="1030" y="600" width="298" height="44" rx="12" fill="rgba(212,165,116,0.18)"/>
  <text x="1050" y="629" fill="#F0EFE8" font-family="Inter, Arial, sans-serif" font-size="15">! changelog stale</text>

  <text x="232" y="754" fill="#7FBC8C" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">CLI  →  Local Harness  →  GitHub Actions  →  Production Agent Library</text>
</svg>
