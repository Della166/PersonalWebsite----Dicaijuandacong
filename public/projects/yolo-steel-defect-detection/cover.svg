      <stop offset="0%" stop-color="#0e1a14"/>
      <stop offset="100%" stop-color="#1a2620"/>
    </linearGradient>
    <pattern id="steel" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(115)">
      <rect width="14" height="14" fill="#2a3631"/>
